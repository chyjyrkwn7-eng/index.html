<title>Study drill</title>
<style>
  :root{
    --ink:#121A20;
    --paper:#E4E9EC;
    --panel:#F8FAFB;
    --rule:#A9B6BD;
    --soft:#5C6E78;
    --wrong:#A3323C;
    --right:#1F6B4A;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }

  button{
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none;
  }

  body{
    background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:17px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    max-width:44rem; margin:0 auto; padding:1.5rem 1.25rem 4rem;
    padding-left:max(1.25rem, env(safe-area-inset-left));
    padding-right:max(1.25rem, env(safe-area-inset-right));
    padding-bottom:max(4rem, env(safe-area-inset-bottom));
  }

  .top{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:1rem; padding-bottom:.75rem; border-bottom:1px solid var(--rule);
  }
  .top h1{ font-size:1.05rem; font-weight:600; letter-spacing:-0.01em; margin:0; }

  .restart{
    background:none; border:none; padding:0; font:inherit; font-size:.9rem;
    color:var(--soft); text-decoration:underline; text-underline-offset:3px; cursor:pointer;
  }
  .restart:hover{ color:var(--ink); }
  .restart[hidden]{ display:none; }

  .meter{ display:flex; flex-wrap:wrap; gap:4px; margin:.9rem 0 .5rem; }
  .meter[hidden]{ display:none; }
  .tick{ width:16px; height:7px; border-radius:1px; background:var(--rule); }
  .tick.now{ background:var(--ink); }
  .tick.clean{ background:var(--right); }
  .tick.messy{ background:var(--wrong); }
  .tick.done{ background:var(--ink); }
  .meter.long{ display:block; gap:0; }
  .track{ position:relative; height:7px; border-radius:1px; background:var(--rule); overflow:hidden; }
  .fill{ position:absolute; top:0; left:0; bottom:0; background:var(--ink); }

  .count{ margin:0 0 2rem; font-size:.9rem; color:var(--soft); }

  .panel{
    background:var(--panel); border:1px solid var(--rule); border-radius:3px;
    padding:1.75rem 1.5rem 1.5rem;
  }

  .qnum{ font-size:.85rem; font-weight:600; color:var(--soft); margin:0 0 .6rem; }

  .qtext{
    font-family:var(--serif); font-size:1.3rem; line-height:1.45;
    margin:0 0 .5rem; max-width:34em;
  }
  .qtext strong{ font-weight:700; }

  .ref{ font-size:.82rem; color:var(--soft); margin:0 0 1.5rem; max-width:40em; }
  .ref[hidden]{ display:none; }

  .choices{ display:flex; flex-direction:column; gap:.5rem; margin-bottom:1.25rem; }
  .choices[hidden]{ display:none; }

  .choice{
    display:grid; grid-template-columns:6px 1.6rem 1fr 1.4rem;
    align-items:start; gap:0 .7rem; width:100%; text-align:left;
    background:#fff; border:1px solid var(--rule); border-radius:2px;
    padding:0; overflow:hidden;
    font-family:var(--serif); font-size:1.02rem; line-height:1.45; color:var(--ink);
    cursor:pointer;
  }
  .choice:hover{ border-color:var(--ink); }
  .choice:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

  .bar{ background:var(--rule); align-self:stretch; }
  .key{
    font-family:var(--sans); font-size:.85rem; font-weight:600; color:var(--soft);
    padding:.85rem 0 .85rem .4rem;
  }
  .text{ padding:.8rem 0; }
  .mark{ font-family:var(--sans); font-size:.95rem; padding:.8rem .7rem 0 0; color:transparent; }

  /* exam mode: a pick is recorded, not judged */
  .choice.is-picked{ border-color:var(--ink); }
  .choice.is-picked .bar{ background:var(--ink); }
  .choice.is-picked .key{ color:var(--ink); }
  .choice.is-picked .mark{ color:var(--ink); }

  .choice.is-right{ border-color:var(--right); cursor:default; }
  .choice.is-right .bar{ background:var(--right); }
  .choice.is-right .key{ color:var(--right); }
  .choice.is-right .mark{ color:var(--right); }

  .choice.hinted{ border-color:var(--right); border-style:dashed; }
  .choice.locked{ cursor:default; }
  .choice.locked:hover{ border-color:var(--rule); }
  .choice.is-right.locked:hover{ border-color:var(--right); }

  .foot{
    display:flex; align-items:center; justify-content:space-between;
    gap:1rem; flex-wrap:wrap; border-top:1px solid var(--rule); padding-top:1rem;
  }
  .status{ font-size:.92rem; color:var(--soft); margin:0; max-width:34em; }
  .status.bad{ color:var(--wrong); }
  .status.good{ color:var(--right); }

  .next{
    font-family:var(--sans); font-size:.95rem; font-weight:600;
    color:var(--panel); background:var(--ink); border:1px solid var(--ink);
    border-radius:2px; padding:.6rem 1.2rem; cursor:pointer;
  }
  .next:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .next[hidden]{ display:none; }
  .next:disabled{ opacity:.35; cursor:default; }
  .next.ghost{ color:var(--ink); background:transparent; }
  .next.ghost:hover{ background:var(--paper); }

  .giveup{ margin-top:.85rem; }
  .giveup[hidden]{ display:none; }

  /* ---------- setup screen ---------- */

  .sect{ margin:0 0 1.5rem; }
  .slab{
    font-size:.78rem; font-weight:700; color:var(--soft);
    letter-spacing:.06em; text-transform:uppercase; margin:0 0 .55rem;
  }

  .picks{ display:flex; flex-direction:column; gap:.5rem; margin-bottom:.7rem; }
  .pick{
    position:relative;
    display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:0 .9rem;
    background:#fff; border:1px solid var(--rule); border-radius:2px;
    padding:.8rem .9rem; cursor:pointer; color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  .pick:hover{ border-color:var(--ink); }
  .pick input{ position:absolute; opacity:0; width:0; height:0; }
  .box{
    width:22px; height:22px; border:2px solid var(--rule); border-radius:3px;
    background:#fff; display:grid; place-items:center;
    font-size:.85rem; font-weight:700; color:transparent; line-height:1;
  }
  .pick input:checked ~ .box{ background:var(--ink); border-color:var(--ink); color:var(--panel); }
  .pick input:focus-visible ~ .box{ outline:2px solid var(--ink); outline-offset:2px; }
  .pick:has(input:checked){ border-color:var(--ink); }
  .pname{ font-family:var(--serif); font-size:1.08rem; line-height:1.35; }
  .pcount{ font-size:.85rem; color:var(--soft); white-space:nowrap; }

  .chips{ display:flex; flex-wrap:wrap; gap:.45rem; }
  .chip{
    font-family:var(--sans); font-size:.9rem; color:var(--ink);
    background:#fff; border:1px solid var(--rule); border-radius:2px;
    padding:.5rem .85rem; cursor:pointer;
  }
  .chip:hover{ border-color:var(--ink); }
  .chip.on{ background:var(--ink); border-color:var(--ink); color:var(--panel); }
  .chip:disabled{ opacity:.35; cursor:default; }
  .chip:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

  .opt{ display:flex; align-items:flex-start; gap:.7rem; padding:.35rem 0; cursor:pointer; }
  .opt input{ position:absolute; opacity:0; width:0; height:0; }
  .opt .box{ flex:none; margin-top:.1rem; }
  .opt input:checked ~ .box{ background:var(--ink); border-color:var(--ink); color:var(--panel); }
  .opt input:focus-visible ~ .box{ outline:2px solid var(--ink); outline-offset:2px; }
  .otext{ font-size:.95rem; }
  .ohint{ display:block; font-size:.82rem; color:var(--soft); }

  .startbar{
    display:flex; align-items:center; gap:1rem; flex-wrap:wrap;
    border-top:1px solid var(--rule); padding-top:1.25rem;
  }
  .note{ font-size:.85rem; color:var(--soft); margin:.9rem 0 0; }

  /* ---------- summary ---------- */

  .score{ margin:0 0 1.6rem; }
  .pct{
    display:block; font-family:var(--serif); font-size:2.9rem; line-height:1;
    font-weight:700; letter-spacing:-0.02em;
  }
  .pct.made{ color:var(--right); }
  .pct.short{ color:var(--wrong); }
  .slabel{ display:block; font-size:.9rem; color:var(--soft); margin-top:.45rem; max-width:34em; }

  .review{ list-style:none; margin:0 0 1.75rem; padding:0; }
  .review li{
    display:grid; grid-template-columns:6px 1fr; gap:.9rem;
    padding:.85rem 0; border-bottom:1px solid var(--rule);
  }
  .review li::before{ content:""; background:var(--wrong); border-radius:1px; }
  .review .rq{ font-family:var(--serif); font-size:1.05rem; line-height:1.45; }
  .review .ra{ font-size:.88rem; color:var(--soft); margin-top:.3rem; }

  .actions{ display:flex; gap:.6rem; flex-wrap:wrap; }

  .err{ border-left:6px solid var(--wrong); padding:.5rem 0 .5rem 1rem; font-size:.95rem; }

  .hint{ margin-top:1.5rem; font-size:.85rem; color:var(--soft); }
  .hint[hidden]{ display:none; }

  @media (max-width:32rem){
    .qtext{ font-size:1.15rem; }
    .panel{ padding:1.25rem 1rem; }
    .wrap{ padding:1.25rem .9rem 3rem; }
  }

  @media (hover:none) and (pointer:coarse){
    .hint{ display:none; }
    .choice .key, .choice .text{ padding-top:.95rem; padding-bottom:.95rem; }
    .pick .pname, .pick .pcount{ padding-top:1.05rem; padding-bottom:1.05rem; }
    .next{ padding:.85rem 1.3rem; font-size:1rem; }
    .chip{ padding:.7rem 1rem; }
    .opt{ padding:.6rem 0; }
    .restart{ padding:.35rem 0; }
  }

  @media (prefers-reduced-motion:no-preference){
    .choice, .pick, .chip{ transition:border-color .12s ease, background-color .12s ease; }
    .bar{ transition:background-color .12s ease; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <h1 id="banktitle">Study drill</h1>
    <button class="restart" id="restart" type="button">Start over</button>
  </div>
  <div class="meter" id="meter" aria-hidden="true"></div>
  <p class="count" id="count"></p>
  <main id="stage"></main>
  <p class="hint" id="hint">Press 1 through 9 to pick an answer. Press Enter to continue.</p>
</div>

<script>
/* ==========================================================================
   QUESTION BANK

   To add a question, copy one block and append it to the list. Nothing else
   in this file needs to change.

     topic    which study unit it belongs to. Questions sharing a topic string
              are drilled together. Add a new string to create a new unit.
     src      the question number in the original study guide. Optional.
     q        the question, exactly as written. Wrap a word in *asterisks*
              to render it bold, the way the study guide emphasises it.
     ref      the section or penal code citation. Optional.
     choices  the answer options, in the exact order they appear on the test.
     answer   the position of the correct option, counting from 0
              (first = 0, second = 1, third = 2, fourth = 3, fifth = 4)
   ========================================================================== */

const BANK_TITLE = "Class 26E Study Drill";

/* The drill score is first-try accuracy; the exam score is plain accuracy.
   PASS_MARK only decides whether that number is green or red. It is a display
   threshold, not something taken from the study material. */
const PASS_MARK = 70;

/* After this many wrong attempts on one question, the drill offers to point
   at the correct answer. You still have to select it to move on. */
const HINT_AFTER = 3;

/* Above this many questions in a run, the progress meter becomes one bar
   instead of hundreds of ticks. */
const TICK_LIMIT = 40;

const QUESTIONS = [

  /* ---------- Professionalism and Ethics ---------- */

/* ==========================================================================
   Everything below runs the drill. You should not need to edit it.
   ========================================================================== */

const LETTERS = "ABCDEFGHI".split("");

const stage     = document.getElementById("stage");
const meterEl   = document.getElementById("meter");
const countEl   = document.getElementById("count");
const titleEl   = document.getElementById("banktitle");
const restartEl = document.getElementById("restart");
const hintEl    = document.getElementById("hint");

titleEl.textContent = BANK_TITLE;
document.title = BANK_TITLE;

/* ---------- saved progress -------------------------------------------------
   Kept in the browser, on this device only. Wrapped so that a sandbox with
   storage switched off degrades to a normal in-memory session rather than
   breaking the drill.                                                        */

const STORE_KEY = "class26e.drill.v1";
let storageOK = false;
let store = { stats: {}, opts: null, units: null };

function loadStore(){
  try {
    const raw = window.localStorage.getItem(STORE_KEY);
    storageOK = true;
    if(raw){
      const got = JSON.parse(raw);
      if(got && typeof got === "object"){
        store.stats = got.stats && typeof got.stats === "object" ? got.stats : {};
        store.opts  = got.opts  || null;
        store.units = Array.isArray(got.units) ? got.units : null;
      }
    }
  } catch(e){
    storageOK = false;
  }
}

function saveStore(){
  if(!storageOK) return;
  try { window.localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
  catch(e){ storageOK = false; }
}

function hashOf(s){
  let h = 5381;
  for(let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}

/* Stable per-question id, so edits elsewhere in the bank do not scramble
   which question your history belongs to. */
const KEYS = QUESTIONS.map((q, i) =>
  (q.topic || "") + "|" + (q.src == null ? i : q.src) + "|" +
  hashOf(String(q.q) + "\u0001" + (q.choices || []).join("\u0001")));

function statFor(i){ return store.stats[KEYS[i]] || { n: 0, m: 0 }; }

function recordResult(i, missed){
  const s = statFor(i);
  store.stats[KEYS[i]] = { n: s.n + 1, m: s.m + (missed ? 1 : 0) };
  saveStore();
}

function weakIndexes(){
  return QUESTIONS.map((q, i) => i).filter(i => statFor(i).m > 0);
}

/* ---------- configuration --------------------------------------------------- */

const cfg = {
  units: [],
  mode: "drill",     // drill | exam
  source: "all",     // all | weak
  size: 0,           // 0 = everything selected
  shuffle: false,
  recall: false
};

function applySaved(){
  if(store.opts){
    ["mode", "source", "size", "shuffle", "recall"].forEach(k => {
      if(store.opts[k] !== undefined) cfg[k] = store.opts[k];
    });
  }
  if(store.units) cfg.units = store.units.slice();
  cfg.source = "all";   // never open straight into a weak-list run
}

function rememberConfig(){
  store.opts = { mode: cfg.mode, source: cfg.source, size: cfg.size,
                 shuffle: cfg.shuffle, recall: cfg.recall };
  store.units = cfg.units.slice();
  saveStore();
}

/* ---------- run state --------------------------------------------------- */

let order = [];      // question indexes for this run, already shuffled
let pos = 0;
let attempts = {};   // question index -> attempts this run
let picked = {};     // question index -> chosen option (exam mode)
let layout = {};     // question index -> option order used this run
let lastWrong = false;  // the previous pick on this question was wrong
let cleared = false;
let hinted = false;
let revealed = false;
let runLabel = null;
let runMode = "drill";

function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* Option order for a question in this run. Identity unless shuffle is on. */
function optionOrder(qi){
  if(!layout[qi]){
    const ids = QUESTIONS[qi].choices.map((c, k) => k);
    layout[qi] = cfg.shuffle ? shuffle(ids) : ids;
  }
  return layout[qi];
}
function correctSlot(qi){ return optionOrder(qi).indexOf(QUESTIONS[qi].answer); }

/* ---------- bank validation --------------------------------------------- */

function topicsIn(list){
  const names = [];
  list.forEach(item => {
    const t = (item.topic || "").trim();
    if(t && names.indexOf(t) === -1) names.push(t);
  });
  return names;
}

function checkBank(){
  const problems = [];
  if(!Array.isArray(QUESTIONS) || QUESTIONS.length === 0){
    problems.push("The question list is empty. Add at least one question.");
    return problems;
  }
  QUESTIONS.forEach((item, i) => {
    const where = item.topic ? (item.topic + " #" + (item.src || (i + 1)))
                             : ("Question " + (i + 1));
    if(typeof item.q !== "string" || item.q.trim() === ""){
      problems.push(where + " has no text in its q field.");
    }
    if(!Array.isArray(item.choices) || item.choices.length < 2){
      problems.push(where + " needs at least two choices.");
      return;
    }
    if(item.choices.length > 9){
      problems.push(where + " has more than nine choices, which this drill does not support.");
    }
    if(!Number.isInteger(item.answer) || item.answer < 0 || item.answer >= item.choices.length){
      problems.push(where + " has an answer of " + JSON.stringify(item.answer) +
        ", which is not a valid position. It must be a whole number from 0 to " +
        (item.choices.length - 1) + ".");
    }
  });
  return problems;
}

function showBankProblems(problems){
  meterEl.hidden = true; hintEl.hidden = true; restartEl.hidden = true;
  countEl.textContent = "";
  const box = document.createElement("div");
  const h = document.createElement("p");
  h.className = "qnum";
  h.textContent = "The question bank needs a fix before the drill can run";
  box.appendChild(h);
  problems.forEach(p => {
    const row = document.createElement("p");
    row.className = "err";
    row.textContent = p;
    box.appendChild(row);
  });
  stage.replaceChildren(box);
}

/* ---------- helpers ----------------------------------------------------- */

function toTop(){
  if(typeof window.scrollTo === "function"){ try{ window.scrollTo(0, 0); }catch(e){} }
}

/* Renders text, turning *word* into bold. textContent throughout. */
function writeText(target, text){
  String(text).split(/\*([^*]+)\*/g).forEach((part, i) => {
    if(part === "") return;
    if(i % 2 === 1){
      const b = document.createElement("strong");
      b.textContent = part;
      target.appendChild(b);
    } else {
      target.appendChild(document.createTextNode(part));
    }
  });
}

function scopeLabel(){
  const all = topicsIn(QUESTIONS);
  let base;
  if(cfg.units.length === 0 || cfg.units.length === all.length) base = "All units";
  else if(cfg.units.length === 1) base = cfg.units[0];
  else base = cfg.units.length + " units";
  if(cfg.source === "weak") base += ", missed only";
  return base;
}

function inUnits(i){
  const t = (QUESTIONS[i].topic || "").trim();
  return cfg.units.length === 0 || cfg.units.indexOf(t) !== -1;
}

function poolNow(){
  let ids = QUESTIONS.map((q, i) => i).filter(inUnits);
  if(cfg.source === "weak"){
    const weak = weakIndexes();
    ids = ids.filter(i => weak.indexOf(i) !== -1);
  }
  return ids;
}

/* ---------- setup screen ------------------------------------------------ */

function showSetup(){
  meterEl.hidden = true; hintEl.hidden = true; restartEl.hidden = true;

  const all = topicsIn(QUESTIONS);
  countEl.textContent = QUESTIONS.length + " questions across " + all.length + " units";

  const panel = document.createElement("section");
  panel.className = "panel";

  /* --- units --- */
  const unitSect = document.createElement("div");
  unitSect.className = "sect";
  const unitLab = document.createElement("p");
  unitLab.className = "slab";
  unitLab.textContent = "Units";
  unitSect.appendChild(unitLab);

  const list = document.createElement("div");
  list.className = "picks";
  all.forEach(name => {
    const row = document.createElement("label");
    row.className = "pick";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.value = name;
    cb.checked = cfg.units.indexOf(name) !== -1;
    const box = document.createElement("span");
    box.className = "box"; box.setAttribute("aria-hidden", "true"); box.textContent = "\u2713";
    const label = document.createElement("span");
    label.className = "pname"; label.textContent = name;
    const count = document.createElement("span");
    count.className = "pcount";
    count.textContent = QUESTIONS.filter(x => (x.topic || "").trim() === name).length + " questions";
    row.append(cb, box, label, count);
    list.appendChild(row);
  });
  unitSect.appendChild(list);

  const selAll = document.createElement("button");
  selAll.type = "button"; selAll.className = "restart";
  unitSect.appendChild(selAll);
  panel.appendChild(unitSect);

  const chosenUnits = () =>
    [...list.querySelectorAll("input")].filter(c => c.checked).map(c => c.value);

  /* --- chip rows --- */
  function chipRow(labelText, options, get, set){
    const sect = document.createElement("div");
    sect.className = "sect";
    const lab = document.createElement("p");
    lab.className = "slab"; lab.textContent = labelText;
    sect.appendChild(lab);
    const row = document.createElement("div");
    row.className = "chips";
    options.forEach(o => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip";
      b.dataset.value = String(o.value);
      b.textContent = o.label;
      if(o.disabled) b.disabled = true;
      b.addEventListener("click", () => { set(o.value); paint(); refresh(); });
      row.appendChild(b);
    });
    sect.appendChild(row);
    sect.paint = () => {
      [...row.querySelectorAll(".chip")].forEach(b => {
        b.classList.toggle("on", b.dataset.value === String(get()));
        b.setAttribute("aria-pressed", b.dataset.value === String(get()) ? "true" : "false");
      });
    };
    return sect;
  }

  const modeSect = chipRow("Mode",
    [{ value: "drill", label: "Drill" }, { value: "exam", label: "Exam" }],
    () => cfg.mode, v => { cfg.mode = v; });
  panel.appendChild(modeSect);

  const weakCount = weakIndexes().length;
  const srcSect = chipRow("Draw from",
    [{ value: "all", label: "All questions" },
     { value: "weak", label: weakCount ? "Ones I have missed (" + weakCount + ")" : "Ones I have missed",
       disabled: weakCount === 0 }],
    () => cfg.source, v => { cfg.source = v; });
  panel.appendChild(srcSect);

  const sizeSect = chipRow("Length",
    [{ value: 0, label: "Everything" }, { value: 10, label: "10" },
     { value: 25, label: "25" }, { value: 50, label: "50" },
     { value: 100, label: "100" }, { value: 250, label: "250" }],
    () => cfg.size, v => { cfg.size = v; });
  panel.appendChild(sizeSect);

  /* --- toggles --- */
  const optSect = document.createElement("div");
  optSect.className = "sect";
  const optLab = document.createElement("p");
  optLab.className = "slab"; optLab.textContent = "Options";
  optSect.appendChild(optLab);

  function toggle(text, hint, get, set){
    const row = document.createElement("label");
    row.className = "opt";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = get();
    cb.addEventListener("change", () => { set(cb.checked); refresh(); });
    const box = document.createElement("span");
    box.className = "box"; box.setAttribute("aria-hidden", "true"); box.textContent = "\u2713";
    const wrap = document.createElement("span");
    wrap.className = "otext";
    wrap.appendChild(document.createTextNode(text));
    const h = document.createElement("span");
    h.className = "ohint"; h.textContent = hint;
    wrap.appendChild(h);
    row.append(cb, box, wrap);
    return row;
  }

  optSect.appendChild(toggle("Shuffle answer positions",
    "Options move around, so you cannot pass by remembering that it is C.",
    () => cfg.shuffle, v => { cfg.shuffle = v; }));
  optSect.appendChild(toggle("Hide options until I answer",
    "Read the question and answer it in your head first, then reveal.",
    () => cfg.recall, v => { cfg.recall = v; }));
  panel.appendChild(optSect);

  /* --- start --- */
  const bar = document.createElement("div");
  bar.className = "startbar";

  const startBtn = document.createElement("button");
  startBtn.type = "button"; startBtn.className = "next"; startBtn.id = "nextbtn";

  const reset = document.createElement("button");
  reset.type = "button"; reset.className = "restart"; reset.id = "resetbtn";
  reset.textContent = "Reset my history";

  bar.append(startBtn, reset);
  panel.appendChild(bar);

  const note = document.createElement("p");
  note.className = "note"; note.id = "setupnote";
  panel.appendChild(note);

  /* --- wiring --- */
  function paint(){ modeSect.paint(); srcSect.paint(); sizeSect.paint(); }

  function refresh(){
    cfg.units = chosenUnits();
    const pool = poolNow();
    const n = cfg.size > 0 ? Math.min(cfg.size, pool.length) : pool.length;

    startBtn.disabled = cfg.units.length === 0 || pool.length === 0;
    startBtn.textContent =
      cfg.units.length === 0 ? "Start" :
      pool.length === 0 ? "Nothing to draw" :
      (cfg.mode === "exam" ? "Start exam, " : "Start drill, ") + n +
        (n === 1 ? " question" : " questions");

    selAll.textContent = cfg.units.length === all.length ? "Clear all" : "Select all";

    const bits = [];
    if(cfg.source === "weak" && cfg.units.length && pool.length === 0)
      bits.push("You have not missed anything in the units you ticked.");
    if(cfg.mode === "exam")
      bits.push("Exam mode gives no feedback until the end and does not make you correct your answer.");
    if(!storageOK)
      bits.push("This browser is not letting the page save anything, so your history will not carry over to next time. Download the file and open it in a normal browser tab.");
    else if(weakCount === 0)
      bits.push("Once you have missed a few, they collect here so you can drill just those.");
    note.textContent = bits.join(" ");
    reset.hidden = !storageOK || weakCount === 0;
  }

  list.addEventListener("change", refresh);
  selAll.addEventListener("click", () => {
    const on = chosenUnits().length < all.length;
    list.querySelectorAll("input").forEach(c => { c.checked = on; });
    refresh();
  });
  reset.addEventListener("click", () => {
    store.stats = {};
    saveStore();
    cfg.source = "all";
    showSetup();
  });
  startBtn.addEventListener("click", () => {
    if(startBtn.disabled) return;
    rememberConfig();
    const pool = shuffle(poolNow());
    beginRun(cfg.size > 0 ? pool.slice(0, cfg.size) : pool, null);
  });

  paint(); refresh();
  stage.replaceChildren(panel);
  toTop();
}

/* ---------- running ----------------------------------------------------- */

function beginRun(indexes, label){
  order = indexes.slice();
  pos = 0;
  attempts = {};
  picked = {};
  layout = {};
  runLabel = label || null;
  runMode = cfg.mode;
  meterEl.hidden = false;
  restartEl.hidden = false;
  hintEl.hidden = false;
  openQuestion();
}

function openQuestion(){
  lastWrong = false;
  cleared = false;
  hinted = false;
  revealed = !cfg.recall;
  render();
  toTop();
}

function drawMeter(){
  if(order.length > TICK_LIMIT){
    meterEl.classList.add("long");
    const track = document.createElement("div");
    track.className = "track";
    const fill = document.createElement("div");
    fill.className = "fill";
    fill.style.width = Math.round((pos / order.length) * 100) + "%";
    track.appendChild(fill);
    meterEl.replaceChildren(track);
    return;
  }
  meterEl.classList.remove("long");
  meterEl.replaceChildren(...order.map((qi, i) => {
    const t = document.createElement("span");
    t.className = "tick";
    if(i < pos){
      if(runMode === "exam") t.classList.add("done");
      else t.classList.add(attempts[qi] === 1 ? "clean" : "messy");
    } else if(i === pos){
      t.classList.add("now");
    }
    return t;
  }));
}

function render(){
  const qi = order[pos];
  const item = QUESTIONS[qi];
  const slots = optionOrder(qi);
  const right = correctSlot(qi);

  drawMeter();
  countEl.textContent = scopeLabel() + " \u2014 " +
    (runMode === "exam" ? "exam, " : "") +
    (runLabel ? runLabel + ", " : "") +
    "question " + (pos + 1) + " of " + order.length;

  const panel = document.createElement("section");
  panel.className = "panel";

  const num = document.createElement("p");
  num.className = "qnum";
  num.textContent = "Question " + (pos + 1);
  panel.appendChild(num);

  const qtext = document.createElement("p");
  qtext.className = "qtext";
  writeText(qtext, item.q);
  panel.appendChild(qtext);

  const ref = document.createElement("p");
  ref.className = "ref";
  if(item.ref){ ref.textContent = item.ref; } else { ref.hidden = true; }
  panel.appendChild(ref);

  const list = document.createElement("div");
  list.className = "choices";
  list.hidden = !revealed;

  slots.forEach((orig, slot) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "choice";
    btn.dataset.index = String(slot);

    const bar = document.createElement("span"); bar.className = "bar";
    const key = document.createElement("span");
    key.className = "key"; key.textContent = LETTERS[slot];
    const text = document.createElement("span");
    text.className = "text"; text.textContent = item.choices[orig];
    const mark = document.createElement("span");
    mark.className = "mark"; mark.setAttribute("aria-hidden", "true");

    btn.append(bar, key, text, mark);

    if(runMode === "exam"){
      if(picked[qi] === slot){ btn.classList.add("is-picked"); mark.textContent = "\u25CF"; }
      btn.addEventListener("click", () => choose(slot));
    } else if(cleared){
      if(slot === right){ btn.classList.add("is-right", "locked"); mark.textContent = "\u2713"; }
      else { btn.classList.add("locked"); }
      btn.disabled = true;
    } else {
      if(hinted && slot === right){ btn.classList.add("hinted"); }
      btn.addEventListener("click", () => choose(slot));
    }

    list.appendChild(btn);
  });

  panel.appendChild(list);

  /* recall mode: options stay hidden until asked for */
  if(!revealed){
    const reveal = document.createElement("button");
    reveal.type = "button"; reveal.className = "next"; reveal.id = "revealbtn";
    reveal.textContent = "Show the options";
    reveal.addEventListener("click", () => { revealed = true; render(); });
    panel.appendChild(reveal);
    stage.replaceChildren(panel);
    reveal.focus({ preventScroll: true });
    return;
  }

  const foot = document.createElement("div");
  foot.className = "foot";

  const status = document.createElement("p");
  status.className = "status";
  status.setAttribute("role", "status");

  if(runMode === "exam"){
    status.textContent = picked[qi] === undefined
      ? "Choose an answer. You can change it until you continue."
      : "Answer recorded. You can change it until you continue.";
  } else if(cleared){
    status.classList.add("good");
    status.textContent = attempts[qi] === 1
      ? "Correct, first try."
      : "Correct, after " + attempts[qi] + " attempts.";
  } else if(hinted){
    status.textContent = "The correct answer is outlined. Select it to continue.";
  } else if(lastWrong){
    status.classList.add("bad");
    status.textContent = "Not correct. All options are open again, so choose once more.";
  } else {
    status.textContent = "Pick the correct answer to continue.";
  }
  foot.appendChild(status);

  const next = document.createElement("button");
  next.type = "button"; next.className = "next"; next.id = "nextbtn";
  next.textContent = pos === order.length - 1 ? "See results" : "Next question";
  next.hidden = runMode === "exam" ? (picked[qi] === undefined) : !cleared;
  next.addEventListener("click", advance);
  foot.appendChild(next);

  panel.appendChild(foot);

  /* after enough wrong tries, offer to point at the answer */
  if(runMode === "drill" && !cleared && !hinted && attempts[qi] >= HINT_AFTER){
    const give = document.createElement("div");
    give.className = "giveup";
    const b = document.createElement("button");
    b.type = "button"; b.className = "restart";
    b.textContent = "Show me the correct answer";
    b.addEventListener("click", () => { hinted = true; render(); });
    give.appendChild(b);
    panel.appendChild(give);
  }

  stage.replaceChildren(panel);
  if(!next.hidden) next.focus({ preventScroll: true });
}

function choose(slot){
  const qi = order[pos];

  if(runMode === "exam"){
    picked[qi] = slot;
    render();
    return;
  }

  if(cleared) return;
  attempts[qi] = (attempts[qi] || 0) + 1;

  if(slot === correctSlot(qi)){
    cleared = true;
    recordResult(qi, attempts[qi] > 1 || hinted);
  } else {
    // The loophole fix: nothing is struck through and nothing is disabled, so
    // the answer can never be reached by elimination. Each attempt is a fresh
    // commitment from the full set of options.
    lastWrong = true;
  }
  render();
}

function advance(){
  const qi = order[pos];
  if(runMode === "exam"){
    if(picked[qi] === undefined) return;
    recordResult(qi, optionOrder(qi)[picked[qi]] !== QUESTIONS[qi].answer);
  } else if(!cleared){
    return;
  }
  if(pos === order.length - 1) summarize();
  else { pos += 1; openQuestion(); }
}

/* ---------- results ----------------------------------------------------- */

function summarize(){
  drawMeter();
  hintEl.hidden = true;

  const total = order.length;
  const missed = runMode === "exam"
    ? order.filter(qi => optionOrder(qi)[picked[qi]] !== QUESTIONS[qi].answer)
    : order.filter(qi => attempts[qi] > 1);
  const good = total - missed.length;
  const pct = Math.round((good / total) * 100);

  countEl.textContent = scopeLabel() + " \u2014 " +
    (runMode === "exam" ? "exam" : (runLabel ? runLabel : "run")) + " complete";

  const panel = document.createElement("section");
  panel.className = "panel";

  const score = document.createElement("div");
  score.className = "score";
  const num = document.createElement("span");
  num.className = "pct " + (pct >= PASS_MARK ? "made" : "short");
  num.textContent = pct + "%";
  const label = document.createElement("span");
  label.className = "slabel";
  label.textContent = runMode === "exam"
    ? "Correct: " + good + " of " + total + "."
    : "Answered correctly on the first attempt: " + good + " of " + total +
      (runLabel ? ", on the retry" : "") + ".";
  score.append(num, label);
  panel.appendChild(score);

  const head = document.createElement("p");
  head.className = "qnum";
  head.textContent = missed.length ? "Review these" : "Nothing to review";
  panel.appendChild(head);

  if(missed.length){
    const ul = document.createElement("ul");
    ul.className = "review";
    const sorted = missed.slice();
    if(runMode === "drill") sorted.sort((a, b) => attempts[b] - attempts[a]);
    sorted.forEach(qi => {
      const item = QUESTIONS[qi];
      const li = document.createElement("li");
      const box = document.createElement("div");

      const q = document.createElement("div");
      q.className = "rq";
      writeText(q, item.q);

      const a = document.createElement("div");
      a.className = "ra";
      const yours = runMode === "exam" && picked[qi] !== undefined
        ? "You answered: " + item.choices[optionOrder(qi)[picked[qi]]] + ". "
        : attempts[qi] + " attempts. ";
      a.textContent = yours + "Correct answer: " + item.choices[item.answer] +
        (item.ref ? "  " + item.ref : "");

      box.append(q, a);
      li.appendChild(box);
      ul.appendChild(li);
    });
    panel.appendChild(ul);
  } else {
    const p = document.createElement("p");
    p.className = "qtext";
    p.textContent = runMode === "exam"
      ? "You got every question right."
      : "You cleared every question on the first try.";
    panel.appendChild(p);
  }

  const actions = document.createElement("div");
  actions.className = "actions";
  const toRetry = missed.slice();

  if(toRetry.length){
    const retry = document.createElement("button");
    retry.type = "button"; retry.className = "next"; retry.id = "nextbtn";
    retry.textContent = "Retry the " + toRetry.length + " you missed";
    retry.addEventListener("click", () => beginRun(toRetry, "retry"));
    actions.appendChild(retry);
  }

  const again = document.createElement("button");
  again.type = "button";
  again.className = "next" + (toRetry.length ? " ghost" : "");
  if(!toRetry.length) again.id = "nextbtn";
  again.textContent = "New run";
  again.addEventListener("click", showSetup);
  actions.appendChild(again);

  panel.appendChild(actions);
  stage.replaceChildren(panel);
  toTop();
  actions.firstChild.focus({ preventScroll: true });
}

/* ---------- keyboard ---------------------------------------------------- */

document.addEventListener("keydown", (e) => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;

  if(e.key >= "1" && e.key <= "9"){
    const btn = stage.querySelector('.choice[data-index="' + (Number(e.key) - 1) + '"]');
    if(btn && !btn.disabled){ e.preventDefault(); btn.click(); }
    return;
  }

  if(e.key === "Enter"){
    const reveal = document.getElementById("revealbtn");
    if(reveal){ e.preventDefault(); reveal.click(); return; }
    const next = document.getElementById("nextbtn");
    if(next && !next.hidden && !next.disabled){ e.preventDefault(); next.click(); }
  }
});

restartEl.addEventListener("click", showSetup);

/* ---------- boot -------------------------------------------------------- */

loadStore();
applySaved();

const problems = checkBank();
if(problems.length) showBankProblems(problems);
else showSetup();
</script>

</body>
</html>
